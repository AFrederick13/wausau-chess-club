<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/WCCicon.png">
    <script src="script.js" defer></script>
    <title>Contact - WCC</title>
</head>

<body>

    <header>
        <!-- Container for logo and h1 -->
        <div class="header-container">
            <img src="images/WCC.png" alt="The Wausau Chess Club logo" id="header-logo">
    
            <h1>Wausau Chess Club</h1>
        </div>
    
    
        <nav>
            <a href="/">HOME</a>
            <a href="about">ABOUT</a>
            <a href="contact">CONTACT</a>
        </nav>
    </header>

    <!-- Contact Page top content -->
    <main class="contact-page">
        <section class="contact-intro">
            <h2>Contact</h2>
            <p>Have a question? Email us at: wausauchess@gmail.com, send us a message using the form below,  or reach out to us on Facebook.</p>
            <a href="https://www.facebook.com/WausauChess/" target="_blank" rel="noopener noreferrer" class="contact-links">Wausau Chess on Facebook</a>
        </section>
        
        <!-- Contact Form -->
        <form
            action="https://formspree.io/f/xyekjbav"
            method="POST"
            id="contact-form"
            aria-describedby="contact-form-status">

            <h2>Direct Message Form</h2>

            <label for="contact-email">Your email</label>
            <input id="contact-email" type="email" name="email" autocomplete="email" required>

            <label for="contact-message">Your message</label>
            <textarea id="contact-message" name="message" required rows="7"></textarea>

            <div class="form-buttons">
                <button type="submit">Send Message</button>
            </div>
        </form>

        <p id="contact-form-status" role="status" aria-live="polite"></p>
    </main>

    <hr>

    <img src="images/WCC.png" alt="The Wausau Chess Club logo" id="logo">
    
</body>

</html>
